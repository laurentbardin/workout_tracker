[project]
name = "workout-tracker"
version = "0.7.4"
requires-python = ">=3.12"
dependencies = [
    "asgiref==3.12.1",
    "django>=6.0.0,<6.1.2",
    "psycopg==3.3.5",
    "sqlparse==0.6.0",
]

[dependency-groups]
dev = [
    "django-debug-toolbar>=8.0.0",
]

[tool.ruff.lint.per-file-ignores]
"worksheet/migrations/*" = ["RUF012"]
"worksheet/{admin,forms,models,managers}.py" = ["RUF012"]
