<!doctype html>
{% load static %}
<html lang="en">
    <head>
        <title>{% block title %}Workout Tracker{% endblock %}</title>
        {% block stylesheet %}
        <link rel="stylesheet" href="{% static 'worksheet/css/oat.min.css' %}">
        <link rel="stylesheet" href="{% static 'worksheet/css/base.css' %}">
        {% endblock %}
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body data-sidebar-layout>
        {% block navbar %}
        <nav data-topnav>
            <button data-sidebar-toggle aria-label="Toggle menu" class="outline">☰</button>
            <span>App Name</span>
        </nav>

        <aside data-sidebar>
            <header>Logo</header>
            <nav>...navigation...</nav>
            <footer>Actions</footer>
        </aside>
        {% endblock %}

        <main>
            {% block content %}{% endblock %}
        </main>

        {% block javascript %}
        {% endblock %}
    </body>
</html>
