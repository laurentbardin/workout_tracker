{% load static %}

<button id="result-action-{{ result.id }}"
        popovertarget="notePopover"
        data-note="{{ result.note|default:'' }}"
        hx-on:click="worksheet.initNoteForm('{% url 'worksheet:result' worksheet.id result.id 'note' %}', this)"
        hx-swap-oob="true"
        >
    {% if result.note %}
    <span title="View or modify the note on this result">
        <img src="{% static 'worksheet/img/note-view.svg' %}"
             class="icon"
             alt="View note icon"
             />
    </span>
    {% else %}
    <span title="Add a note to this result">
        <img src="{% static 'worksheet/img/note-add.svg' %}"
             class="icon"
             alt="Add note icon"
             />
    </span>
    {% endif %}
</button>
