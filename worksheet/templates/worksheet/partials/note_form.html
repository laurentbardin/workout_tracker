<form id="noteForm"
      method="POST"
      action="{{ note_form_url }}"
      hx-post="{{ note_form_url }}"
      hx-swap="outerHTML"
      hx-include="[name='csrfmiddlewaretoken']"
      hx-disabled-elt="find input, find button"
      >
      {{ note_form }}
      <button type="submit" class="mt-4">Add note</button>
      <button type="submit" class="outline" hx-on:click="htmx.find('#id_note').value=''">Delete note</button>
</form>
